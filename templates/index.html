<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMR Grading Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>OMR Grading Portal</h1>
        <p>Enter student details and upload the OMR sheet for instant grading.</p>
        
        <form action="/upload" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>Student Name:</label>
                <input type="text" name="student_name" placeholder="e.g., Satoru Gojo" required>
            </div>

            <div class="form-group">
                <label>Student Number (Roll):</label>
                <input type="text" name="student_number" placeholder="e.g., 101" required>
            </div>

            <div class="form-group">
                <label>College Name:</label>
                <input type="text" name="college_name" placeholder="Jujutsu Tech" required>
            </div>

            <div class="form-group">
                <label>Unique ID:</label>
                <input type="text" name="unique_id" placeholder="e.g., SG-101" required>
            </div>

            <div class="form-group">
                <label>Email ID:</label>
                <input type="email" name="email_id" placeholder="gojo@example.com" required>
            </div>

            <div class="form-group upload-box">
                <label>Upload Filled OMR Sheet (PNG/JPG):</label>
                <input type="file" name="omr_image" accept="image/png, image/jpeg" required>
            </div>

            <button type="submit">Process & Grade Exam</button>
        </form>
    </div>
</body>
</html>
