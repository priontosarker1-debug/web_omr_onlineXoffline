<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMR Grading Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        
        <div id="timer-box" style="background: #2c3e50; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px;">
            <h2 style="margin: 0;">Time Remaining: <span id="timer" style="color: #e74c3c;">--:--</span></h2>
            {% if q_url %}
            <a href="{{ q_url }}" target="_blank" style="background: #3498db; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; display: inline-block; margin-top: 10px; font-weight: bold;">
                📖 View Question Paper
            </a>
            {% endif %}
        </div>

        <h1>OMR Grading Portal</h1>
        <p>Enter student details and upload the OMR sheet for instant grading.</p>
        
        <form action="/upload" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>Student Name:</label>
                <input type="text" name="student_name" placeholder="your name" required>
            </div>

            <div class="form-group">
                <label>Student Number (Roll):</label>
                <input type="text" name="student_number" placeholder="017************" required>
            </div>

            <div class="form-group">
                <label>College Name:</label>
                <input type="text" name="college_name" placeholder="NDC" required>
            </div>

            <div class="form-group">
                <label>Unique ID:</label>
                <input type="text" name="unique_id" placeholder="SG-101" required>
            </div>

            <div class="form-group">
                <label>Email ID:</label>
                <input type="email" name="email_id" placeholder="you@gmail.com" required>
            </div>

            <div class="form-group upload-box">
                <label>Upload Filled OMR Sheet (PNG/JPG):</label>
                <input type="file" name="omr_image" accept="image/png, image/jpeg" required>
            </div>

            <button type="submit">Process & Grade Exam</button>
        </form>
    </div>

    <script>
        // This connects to the 'duration' variable from your Admin Panel
        let timeLeft = {{ duration | default(30) }} * 60; 

        function startTimer() {
            const display = document.querySelector('#timer');
            if (!display) return; // Prevents errors if the timer box is missing

            const interval = setInterval(() => {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;

                display.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    alert("Time is up! Submitting your exam automatically.");
                    document.querySelector('form').submit(); 
                }
                timeLeft--;
            }, 1000);
        }
        window.onload = startTimer;
    </script>
</body>
</html>
